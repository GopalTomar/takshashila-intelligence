name: Deploy dashboard to GitHub Pages

# Publishes the STATIC frontend (frontend/) to GitHub Pages. GitHub Pages is
# static hosting only — it cannot run the Python/FastAPI backend — so this
# deploys just the browser dashboard, which calls the always-on backend's
# /api/query over HTTPS. See README "GitHub Pages vs backend".

on:
  push:
    branches: ["main"]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
