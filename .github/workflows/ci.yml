name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Single source of truth: install the exact runtime dependencies the
        # application declares in requirements.txt (the same set local, Docker
        # and Render use), so CI can never drift from production by omitting a
        # package such as `requests`. pytest is the only test-only dependency
        # and is intentionally NOT a runtime dependency.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q src integrations scripts app.py

      - name: Import core modules
        run: |
          python - <<'PY'
          from src import config, kb_version, vector_store, retriever, rag_pipeline, rag_service, groq_client
          assert config.AVAILABLE_MODELS == ["openai/gpt-oss-120b"], config.AVAILABLE_MODELS
          assert config.GROQ_MODEL == "openai/gpt-oss-120b", config.GROQ_MODEL
          print("config OK:", config.GROQ_MODEL)
          PY

      - name: Run full test suite
        # With the full dependency set installed, the entire suite runs —
        # including the crawler tests (require `requests`) and the Streamlit
        # dashboard tests. Nothing is skipped or ignored.
        run: python -m pytest tests/ -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a real secret looks committed
        run: |
          if grep -rInE 'gsk_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}' \
               --include='*.py' --include='*.md' --include='*.yml' --include='*.txt' \
               --include='*.json' --include='*.env*' . ; then
            echo "::error::Possible committed secret found."; exit 1
          fi
          echo "No obvious committed secrets."
